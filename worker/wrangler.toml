name = "eynap-api"
main = "index.js"
compatibility_date = "2026-09-16"

# 评价翻译用：@cf/meta/m2m100-1.2b，免费额度 10000 neurons/天
[ai]
binding = "AI"

# 部署前把 database_id 换成 `wrangler d1 create eynap` 返回的真实 ID
[[d1_databases]]
binding = "DB"
database_name = "eynap"
database_id = "REPLACE_WITH_YOUR_DATABASE_ID"

[vars]
# 作者名：与这个名字一致的评价会显示「作者」标签
OWNER = "yuanchenjie.antares"
# 允许访问的站点来源，正式部署后改成你的域名，例如 "https://eynap.pages.dev"
ALLOW_ORIGIN = "*"

# SALT 用于 IP 散列，不要写在这里。用命令设置：
#   wrangler secret put SALT
