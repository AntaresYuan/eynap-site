<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eynap · Everything You Need as an AI PM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fff'/%3E%3Ctext x='16' y='23' font-family='-apple-system,Helvetica,Arial' font-size='21' font-weight='700' text-anchor='middle' fill='%23000'%3EE%3C/text%3E%3C/svg%3E">
<style>
  /* ============================================================
     全黑 + 幻动微光 + Liquid Glass
     玻璃只用于浮在内容之上的功能层（悬浮胶囊导航 / 粘性 tab / hero 操作条）
     内容层用实心暗面板，遵循 Apple HIG「不要在内容层用 Liquid Glass」
     ============================================================ */
  :root{
    --void:#000000;          /* 纯黑底 */
    --panel:#0e1014;         /* 内容面板 */
    --panel-2:#13161c;       /* 次级面板 */
    --line:rgba(255,255,255,.09);
    --line-2:rgba(255,255,255,.055);

    --ink:#f5f7fa;           /* 主文字 */
    --ink-2:#a8b0bd;         /* 次级 */
    --ink-3:#6f7885;         /* 三级 */

    --brand:#4080FF;         /* Arco 主色亮态，暗底上用 hover 档更清晰 */
    --brand-deep:#165DFF;
    --ok:#23c343; --warn:#ff9a2e; --err:#f76965;

    --r-s:10px; --r-m:14px; --r-l:18px; --r-pill:100px;
    /* 阴影取 doubao work 的冷灰调，不是死黑 */
    --sh-float:0 20px 30px rgba(6,10,18,.55);
    --sh-panel:0 1px 0 rgba(255,255,255,.03) inset;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;background:var(--void)}
  body{font-family:"SF Pro Display","SF Pro Text",-apple-system,BlinkMacSystemFont,
    "PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
    background:var(--void);color:var(--ink);font-size:14px;line-height:1.62;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit;text-decoration:none}
  button,input,textarea{font-family:inherit}
  ::selection{background:rgba(64,128,255,.3)}
  .mono{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-variant-ligatures:none}
  svg{display:block}

  /* ---------- 幻动微光：整站背景，固定不随滚动 ---------- */
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .aurora i{position:absolute;display:block;border-radius:50%;filter:blur(100px);opacity:.42;
    will-change:transform}
  .aurora .a1{width:900px;height:660px;left:14%;top:-22%;
    background:radial-gradient(circle,rgba(64,128,255,.60),transparent 68%);
    animation:drift1 26s ease-in-out infinite}
  .aurora .a2{width:760px;height:560px;right:6%;top:-8%;
    background:radial-gradient(circle,rgba(22,93,255,.42),transparent 66%);
    animation:drift2 32s ease-in-out infinite}
  .aurora .a3{width:680px;height:540px;left:26%;top:42%;
    background:radial-gradient(circle,rgba(30,120,190,.26),transparent 68%);
    animation:drift3 38s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(90px,60px,0) scale(1.12)}}
  @keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1.06)}
    50%{transform:translate3d(-80px,50px,0) scale(.94)}}
  @keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(60px,-70px,0) scale(1.15)}}
  /* 细网格，只在上方淡出，制造空间纵深 */
  .aurora::after{content:"";position:absolute;inset:0;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);
    background-size:72px 72px;
    -webkit-mask-image:radial-gradient(1150px 640px at 50% 10%,#000,transparent 78%);
            mask-image:radial-gradient(1150px 640px at 50% 10%,#000,transparent 78%)}
  @media (prefers-reduced-motion:reduce){.aurora i{animation:none}html{scroll-behavior:auto}}

  /* ---------- Liquid Glass：唯一定义，只给功能层 ---------- */
  .glass{position:relative;
    background:rgba(255,255,255,.055);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.10);
    box-shadow:var(--sh-float);
  }
  /* 镜面高光：上缘亮、下缘消失，不是整圈发光描边 */
  .glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:0;
    background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 46%);
    -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px}
  .glass>*{position:relative;z-index:1}
  @media (prefers-reduced-transparency:reduce){
    .glass{background:#14181f;backdrop-filter:none;-webkit-backdrop-filter:none}}

  /* ---------- 悬浮胶囊导航 ---------- */
  .nav{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:80;width:min(1100px,calc(100vw - 28px));
    display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;border-radius:var(--r-pill);
    max-width:calc(100vw - 32px)}
  .nav .logo{display:flex;align-items:baseline;gap:10px;flex:0 0 auto}
  /* 文字标识：字形本身即标识，不外挂图标 */
  .wm{font-size:19px;font-weight:700;letter-spacing:-.035em;color:#fff;line-height:1;
    font-feature-settings:"ss01" 1}
  .wm-sub{display:none}
  .nav .btn{padding:8px 17px;border-radius:var(--r-pill);flex:0 0 auto}

  /* ---------- 语言切换 ---------- */
  .lang{display:flex;gap:2px;padding:3px;border-radius:var(--r-pill);flex:0 0 auto;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
  .lang button{border:none;background:none;color:var(--ink-3);font-size:12px;font-weight:600;
    padding:5px 10px;border-radius:var(--r-pill);cursor:pointer;transition:.16s;line-height:1}
  .lang button:hover{color:#fff}
  .lang button.on{color:#fff;background:rgba(255,255,255,.14);
    box-shadow:0 1px 0 rgba(255,255,255,.2) inset}

  /* ---------- 版权与鸣谢 ---------- */
  .cred{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:22px 25px}
  .cred+.cred{margin-top:10px}
  .cred p{color:var(--ink-2);font-size:14px;line-height:1.75}
  .cred p+p{margin-top:11px}
  .cred-head{display:flex;align-items:center;gap:13px;padding-bottom:17px;margin-bottom:17px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  .cav{width:38px;height:38px;border-radius:50%;flex:none;
    background:linear-gradient(140deg,#4080FF,#1a5fd0)}
  .cname{font-size:15.5px;font-weight:650}
  .crole{font-size:12.5px;color:var(--ink-3);margin-top:2px}
  .cbtn{display:inline-flex;align-items:center;gap:7px;margin-left:auto;font-size:13px;
    padding:8px 15px;border-radius:var(--r-s);border:1px solid var(--line);
    background:rgba(255,255,255,.05);color:var(--ink);transition:.16s;white-space:nowrap}
  .cbtn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24)}
  .cbtn svg{width:15px;height:15px}
  .cbtns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
  .cbtns .cbtn{margin-left:0}
  .cnote{font-size:12.5px;color:var(--ink-3);line-height:1.6}
  .lic{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
  .lic-tag{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:13px;font-weight:700;
    padding:8px 14px;border-radius:9px;background:rgba(64,128,255,.14);color:#87abff;
    border:1px solid rgba(64,128,255,.24);flex:none}
  .lic-body{flex:1;min-width:260px}
  .lic-name{font-size:14px;font-weight:600;margin-bottom:11px}
  .lic-body ul{padding-left:17px;color:var(--ink-2);font-size:13.5px}
  .lic-body li{margin:6px 0}.lic-body li b{color:var(--ink)}
  .clink{display:inline-block;margin-top:13px;font-size:13px;color:#87abff}
  .clink:hover{text-decoration:underline}
  .thanks p{font-size:14.5px;color:var(--ink-2)}
  .flic{font-size:12.5px;color:var(--ink-3);margin-top:5px}
  .flic a{color:var(--ink-2);text-decoration:underline;text-underline-offset:2px}
  .flic a:hover{color:#fff}

  /* ---------- 按钮 ---------- */
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:var(--r-s);padding:9px 16px;
    font-size:13.5px;font-weight:550;border:1px solid transparent;cursor:pointer;transition:.18s;white-space:nowrap}
  .btn svg{width:14px;height:14px;flex:none}
  .btn-light{background:#fff;color:#000;box-shadow:0 2px 10px -2px rgba(0,0,0,.45)}
  .btn-light:hover{background:#e9edf3;transform:translateY(-1px);box-shadow:0 6px 18px -4px rgba(0,0,0,.5)}
  .btn-line{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.16);color:var(--ink)}
  .btn-line:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.3)}
  .btn-lg{padding:13px 26px;font-size:15px;border-radius:12px}
  .btn-lg svg{width:16px;height:16px}

  /* ---------- 内容容器 ---------- */
  .stage{position:relative;z-index:1}
  .wrap{max-width:1040px;margin:0 auto;padding:0 26px 100px}
  .main{padding-top:4px}

  /* ---------- hero：整屏叙事 ---------- */
  .hero{position:relative;padding:176px 26px 0;text-align:center}
  .hero-in{max-width:1040px;margin:0 auto;padding-bottom:88px}
  .hero h1{font-size:clamp(42px,6.4vw,76px);line-height:1.04;font-weight:680;letter-spacing:-.038em}
  .hero h1 .l2{background:linear-gradient(96deg,#ffffff 8%,#9dc0ff 52%,#4c86e8 98%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .hero-sub{margin-top:26px;max-width:640px;margin-left:auto;margin-right:auto;
    color:var(--ink-2);font-size:17.5px;line-height:1.72}
  .hero-bar{margin-top:40px;display:inline-flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-l)}
  .hero-stats{margin-top:74px;display:grid;grid-template-columns:repeat(4,1fr);
    border-top:1px solid var(--line);max-width:860px;margin-left:auto;margin-right:auto}
  .hs{padding:26px 8px 0;position:relative;text-align:center}
  .hs+.hs::before{content:"";position:absolute;left:0;top:28px;bottom:4px;width:1px;background:var(--line)}
  .hs b{display:block;font-size:31px;font-weight:650;letter-spacing:-.03em;line-height:1.1;
    font-variant-numeric:tabular-nums}
  .hs span{color:var(--ink-3);font-size:12.5px;margin-top:6px;display:block}

  /* ---------- 粘性 tab ---------- */
  .tabs{display:flex;gap:1px;flex:1 1 auto;min-width:0;justify-content:center}
  /* 折叠态下，菜单按钮后面留一个弹性空隙，把语言与下载推到最右 */
  .nav .navmenu-btn{margin-right:auto}
  /* 窄屏菜单按钮：默认藏着，标签行放不下时才出现 */
  .navmenu-btn{display:none;align-items:center;gap:8px;flex:0 0 auto;cursor:pointer;
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
    color:var(--ink);border-radius:var(--r-pill);padding:8px 14px;font-size:13.5px;
    font-weight:550;transition:.16s}
  .navmenu-btn:hover{background:rgba(255,255,255,.12)}
  .navmenu-btn svg{width:16px;height:16px;flex:none}
  .navmenu-btn span{white-space:nowrap}
  /* 下拉面板 */
  .navsheet{display:none;position:fixed;top:var(--ns-top,78px);left:var(--ns-left,20px);
    transform:translateY(-6px);z-index:79;width:min(260px,calc(100vw - 32px));
    padding:7px;border-radius:14px;opacity:0;pointer-events:none;
    transition:opacity .16s ease, transform .16s cubic-bezier(.2,.8,.3,1)}
  .navsheet.open{display:block;opacity:1;pointer-events:auto;transform:translateY(0)}
  .ns-item{display:block;width:100%;text-align:left;background:none;border:none;cursor:pointer;
    color:var(--ink-2);font-size:14.5px;font-weight:500;padding:11px 15px;
    border-radius:11px;transition:.14s}
  .ns-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .ns-item.on{background:rgba(255,255,255,.14);color:#fff;font-weight:650}
  .tabs::-webkit-scrollbar{display:none}
  .tab{position:relative;padding:8px 13px;font-size:13.5px;color:var(--ink-2);background:none;border:none;
    border-radius:var(--r-pill);white-space:nowrap;transition:.18s;font-weight:500;cursor:pointer;
    border:1px solid transparent}
  .tab:hover{color:#fff;background:rgba(255,255,255,.07)}
  /* 选中态 = 浮在导航玻璃之上的一小片更亮的玻璃。
     它是状态标记，不是操作，所以不抢主按钮那唯一的实心白。 */
  .tab.active{color:#fff;font-weight:600;
    background:rgba(255,255,255,.16);
    -webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.15);
    backdrop-filter:blur(14px) saturate(200%) brightness(1.15);
    border-color:rgba(255,255,255,.22);
    box-shadow:0 1px 0 rgba(255,255,255,.28) inset, 0 4px 14px -6px rgba(0,0,0,.6)}
  /* 上缘镜面高光，与外层玻璃同一套语言 */
  .tab.active::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 52%);
    -webkit-mask:linear-gradient(#000,#000) content-box,linear-gradient(#000,#000);
    -webkit-mask-composite:xor;mask-composite:exclude;padding:1px}
  @media (prefers-reduced-transparency:reduce){
    .tab.active{background:rgba(255,255,255,.22);backdrop-filter:none;-webkit-backdrop-filter:none}}
  .pane{display:none;padding-top:8px}
  .pane.active{display:block}

  .sect-h{font-size:18px;font-weight:650;margin:44px 0 18px;letter-spacing:-.014em;
    scroll-margin-top:150px;text-align:center}
  .sect-h:first-child{margin-top:0}
  .note{margin-top:22px;color:var(--ink-3);font-size:13px;line-height:1.8;
    text-align:center;max-width:680px;margin-left:auto;margin-right:auto}

  /* ---------- 内容层：实心暗面板 ---------- */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
    box-shadow:var(--sh-panel)}
  .what{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
    padding:23px 25px;color:var(--ink-2);font-size:14.5px;box-shadow:var(--sh-panel)}
  code{background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;font-size:12.5px;
    color:#c3ccdb;font-family:"SF Mono",ui-monospace,Menlo,monospace}

  /* ---------- 任务卡 ---------- */
  .jobs{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
  .job{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 22px;
    cursor:pointer;transition:.2s cubic-bezier(.2,.8,.3,1);position:relative;overflow:hidden}
  .job::before{content:"";position:absolute;inset:0;opacity:0;transition:.22s;
    background:radial-gradient(420px 180px at 12% 0%,rgba(64,128,255,.16),transparent 70%)}
  .job:hover{border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
  .job:hover::before{opacity:1}
  .job>*{position:relative;z-index:1}
  .job .q{font-size:15px;font-weight:600;line-height:1.52;letter-spacing:-.008em}
  .job .a{margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .job .a .cmd{background:rgba(255,255,255,.1);color:#dfe6f2;font-size:12px;padding:4px 11px;border-radius:7px;
    font-family:"SF Mono",ui-monospace,Menlo,monospace;border:1px solid rgba(255,255,255,.08)}
  .job .a .n{color:var(--ink-3);font-size:12.5px}
  .job .cpz{position:absolute;right:17px;top:18px;color:var(--ink-3);opacity:0;transition:.15s;z-index:2}
  .job:hover .cpz{opacity:1}
  .job .cpz svg{width:14px;height:14px}

  /* ---------- 折叠 ---------- */
  .acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m)}
  .acc+.acc{margin-top:10px}
  .acc-head{padding:16px 21px;font-weight:600;display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14.5px}
  .acc-head .caret{margin-left:auto;color:var(--ink-3);transition:transform .2s}
  .acc-head .caret svg{width:15px;height:15px}
  .acc.open .caret{transform:rotate(90deg)}
  .acc-body{display:none;padding:0 21px 18px;color:var(--ink-2)}
  .acc.open .acc-body{display:block}
  .acc-body ul{padding-left:17px}.acc-body li{margin:7px 0;font-size:14px}
  .acc-body b{color:var(--ink)}

  /* ---------- 技能行 ---------- */
  .atomlist{display:grid;gap:10px}
  .arow{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 21px;
    display:flex;gap:15px;align-items:flex-start;transition:.16s}
  .arow:hover{border-color:rgba(255,255,255,.18)}
  .arow .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;color:#fff}
  .arow .ic svg{width:16px;height:16px}
  .ic.orch{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.14)}
  .ic.research{background:#2f6bff}.ic.value{background:#159b43}.ic.prd{background:#c67810}
  .ic.entity{background:#6f4bd8}.ic.design{background:#c8415f}
  .arow h4{font-size:15px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap;letter-spacing:-.008em}
  .arow p{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.6}
  .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:5px}
  .tag.new{background:rgba(35,195,67,.16);color:#4ade6a}
  .tag.ext{background:rgba(255,255,255,.08);color:var(--ink-2)}
  .tag.orch{background:rgba(64,128,255,.18);color:#87abff}
  .arow .path{margin-left:auto;font-size:12px;color:var(--ink-3);white-space:nowrap;padding-top:2px}

  .flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
  .fm{font-size:12.5px;border:1px solid var(--line);border-radius:9px;padding:8px 14px;
    background:var(--panel);color:var(--ink-2)}
  .fm b{color:var(--ink);font-weight:600}
  .fm .k{color:var(--ink-3);font-size:11.5px;margin-left:6px;font-family:"SF Mono",ui-monospace,monospace}
  .flow .ar{color:#4a525f}.flow .ar svg{width:15px;height:15px}
  .flow-note{margin-top:16px;color:var(--ink-3);font-size:13px;text-align:center}

  /* ---------- 安装 ---------- */
  .dlbox{background:linear-gradient(120deg,rgba(64,128,255,.16),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.14);border-radius:var(--r-m);padding:21px 25px;
    display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .dlbox b{font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:14.5px;font-weight:600}
  .dlbox .dlmeta{color:var(--ink-2);font-size:13px;margin-left:10px}
  .dlbox .btn{margin-left:auto}
  .installs{display:grid;gap:10px;margin-top:14px}
  .ins{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:18px 21px}
  .ins .ih{display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:600}
  .ins .ih .n{width:21px;height:21px;border-radius:7px;background:rgba(255,255,255,.09);color:var(--ink-2);
    font-size:11.5px;display:grid;place-items:center;flex:none;font-weight:700}
  .ins .ih .tip{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-weight:400}
  .ins .cmd{margin-top:12px;background:rgba(0,0,0,.4);border:1px solid var(--line-2);border-radius:10px;
    padding:12px 15px;font-size:12.5px;color:#b9c3d3;font-family:"SF Mono",ui-monospace,Menlo,monospace;
    display:flex;gap:12px;align-items:flex-start;line-height:1.68}
  .ins .cmd .cpy{margin-left:auto;cursor:pointer;color:var(--ink-3);flex:none}
  .ins .cmd .cpy svg{width:14px;height:14px}
  .ins .cmd .cpy:hover{color:#fff}

  /* ---------- 质量检查 ---------- */
  .qc-top{display:flex;align-items:baseline;margin-bottom:16px}
  .qc-top .t{font-size:17.5px;font-weight:650}
  .qc-top .when{margin-left:auto;color:var(--ink-3);font-size:13px}
  .qc-overview{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:27px 29px}
  .qc-num{display:flex;align-items:center;gap:21px;flex-wrap:wrap}
  .qc-num .n{font-size:52px;font-weight:650;color:#4ade6a;letter-spacing:-.035em;line-height:1;
    font-variant-numeric:tabular-nums}
  .qc-num .t1{font-size:16px;font-weight:650;display:flex;align-items:center;gap:9px}
  .qc-num .t2{color:var(--ink-2);font-size:13.5px;margin-top:5px}
  .qc-p0{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:23px 0}
  .qc-p0 .c{border:1px solid var(--line);border-radius:11px;padding:16px 18px;background:var(--panel-2)}
  .qc-p0 .c .h{font-size:13px;margin-bottom:10px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
  .qc-p0 .c .h i{width:7px;height:7px;border-radius:50%;display:block}
  .qc-p0 .c .h .p0{background:var(--err)}.qc-p0 .c .h .p1{background:var(--warn)}.qc-p0 .c .h .p2{background:var(--brand)}
  .qc-p0 .c .v{font-size:15px;font-weight:600}
  .qc-dims{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:12px}
  .dim{border:1px solid var(--line);border-radius:11px;padding:15px 17px;background:var(--panel-2)}
  .dim .dn{font-size:13px;color:var(--ink-2);margin-bottom:11px}
  .dim .bar{height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
  .dim .bar i{display:block;height:100%;background:#4ade6a;border-radius:2px}
  .dim .dv{font-size:12px;color:var(--ink-3);margin-top:8px;font-variant-numeric:tabular-nums}
  .lvl{margin-top:25px}
  .lvl-h{display:flex;gap:11px;align-items:baseline;margin-bottom:12px;flex-wrap:wrap}
  .lvl-h .lvl-tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px}
  .lvl-h b{font-size:14.5px}
  .lvl-h .ln{color:var(--ink-3);font-size:13px}
  .lvl0 .lvl-tag{background:rgba(247,105,101,.16);color:#f88}
  .lvl1 .lvl-tag{background:rgba(255,154,46,.16);color:#ffb35c}
  .lvl2 .lvl-tag{background:rgba(64,128,255,.18);color:#87abff}
  .lvl-row{display:flex;align-items:center;justify-content:space-between;background:var(--panel);
    border:1px solid var(--line);border-radius:11px;padding:15px 20px;margin-bottom:8px}
  .lvl-row .l{color:var(--ink-2);font-size:14px}
  .lvl-row .pass{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:10px;
    font-variant-numeric:tabular-nums}
  .lvl-row .pass .ok{background:rgba(35,195,67,.16);color:#4ade6a;font-size:11.5px;padding:2px 9px;
    border-radius:5px;font-weight:600}
  .lvl-row .pass .no{background:rgba(255,154,46,.16);color:#ffb35c;font-size:11.5px;padding:2px 9px;
    border-radius:5px;font-weight:600}

  /* ---------- 评测 ---------- */
  .planned{background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--warn);
    border-radius:var(--r-m);padding:22px 26px;margin-bottom:20px}
  .planned h3{font-size:16px;margin-bottom:8px;font-weight:650}
  .planned p{color:var(--ink-2);font-size:14px}
  .evd{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);
    border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;table-layout:fixed}
  .evd th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:13px 18px;
    background:rgba(255,255,255,.03);border-bottom:1px solid var(--line);letter-spacing:.02em}
  .evd td{padding:15px 18px;font-size:13.5px;color:var(--ink-2);border-bottom:1px solid var(--line-2);
    vertical-align:top;line-height:1.62}
  .evd tr:last-child td{border-bottom:none}
  .evd td.d{font-weight:650;color:var(--ink)}

  /* ---------- 版本 ---------- */
  .ver{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 24px;margin-bottom:12px}
  .ver .vh{display:flex;align-items:center;gap:11px;font-size:15px;font-weight:650;flex-wrap:wrap}
  .ver .vh .num{font-family:"SF Mono",ui-monospace,Menlo,monospace}
  .ver .vmeta{margin-left:auto;color:var(--ink-3);font-size:12.5px;font-weight:400}
  .ver .vcommits{margin:13px 0 0 6px;border-left:2px solid var(--line);padding-left:17px;color:var(--ink-2)}
  .ver .vcommits p{margin:6px 0;font-family:"SF Mono",ui-monospace,Menlo,monospace;font-size:12.5px}
  .cur-tag{background:rgba(35,195,67,.16);color:#4ade6a;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:5px}

  /* ---------- 反馈 ---------- */
  .rsummary{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);
    padding:25px 29px;display:flex;align-items:center;gap:42px;flex-wrap:wrap}
  .rsummary .avg{font-size:46px;font-weight:650;line-height:1;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
  .rsummary .stars{color:#ffb020;letter-spacing:2px;font-size:16px;margin-top:8px}
  .rsummary .rc{color:var(--ink-3);font-size:12.5px;margin-top:7px}
  .rsummary .dims3{display:flex;gap:34px;flex-wrap:wrap}
  .rsummary .d3{font-size:13px;color:var(--ink-3)}
  .rsummary .d3 b{display:block;font-size:19px;color:var(--ink);font-weight:650;margin-top:4px;
    font-variant-numeric:tabular-nums}
  .rform{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:22px 25px;margin:16px 0}
  .rform .rv-author{width:250px;max-width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 14px;
    font-size:13.5px;background:rgba(0,0,0,.35);color:var(--ink);margin-bottom:10px;display:block;transition:.16s}
  .rform textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:13px 15px;
    font-size:14px;min-height:80px;resize:vertical;background:rgba(0,0,0,.35);color:var(--ink);
    transition:.16s;line-height:1.62}
  .rform input::placeholder,.rform textarea::placeholder{color:#5d6673}
  .rform input:focus,.rform textarea:focus{outline:none;border-color:rgba(64,128,255,.6);
    box-shadow:0 0 0 3px rgba(64,128,255,.14)}
  .rform .row{display:flex;align-items:center;gap:26px;margin-top:16px;flex-wrap:wrap}
  .rate-grp{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2)}
  .mini-stars{display:inline-flex;gap:2px;font-size:17px;color:#3a414c;cursor:pointer;user-select:none}
  .mini-stars span.on{color:#ffb020}
  .send{margin-left:auto;background:#fff;color:#000;border:none;border-radius:var(--r-s);
    padding:10px 21px;font-size:13.5px;font-weight:600;cursor:pointer;transition:.18s}
  .send:hover{background:#e6eaf0;transform:translateY(-1px)}
  .rlist-h{font-size:15px;font-weight:650;margin:27px 0 12px}
  .review{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-m);padding:20px 24px;margin-bottom:10px}
  .review .rh{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
  .review .av{width:28px;height:28px;border-radius:50%;flex:none;
    display:grid;place-items:center;font-size:11.5px;font-weight:600;
    color:rgba(255,255,255,.92);letter-spacing:.02em;
    background:linear-gradient(140deg,var(--av-a,#4080FF),var(--av-b,#1a5fd0))}
  .review .ra{font-weight:650;font-size:14px}
  .review .owner-tag{background:rgba(255,255,255,.08);color:var(--ink-2);font-size:11.5px;padding:1px 8px;border-radius:5px}
  .review .rdate{color:var(--ink-3);font-size:12.5px;margin-left:auto}
  .review .rstars{color:#ffb020;letter-spacing:1px;font-size:13px}
  .review p{color:var(--ink-2);font-size:14px;line-height:1.66}
  /* 译文：左侧竖线 + 略降透明度，一眼能看出不是原话 */
  .review p.translated{
    padding-left:11px;border-left:2px solid rgba(120,160,255,.35);
    color:var(--ink-3);font-style:normal}
  .tr-btn{margin-top:9px;padding:0;border:0;background:none;cursor:pointer;
    font-size:12.5px;color:var(--ink-3);letter-spacing:.01em;
    transition:color .15s ease}
  /* 自动显示的译文要让人知道不是原话 */
  .review p.translated::before{
    content:attr(data-note);display:block;margin-bottom:5px;
    font-size:11.5px;color:var(--ink-3);opacity:.72;letter-spacing:.02em}
  .tr-btn:hover{color:var(--ink-1)}
  .tr-btn:disabled{opacity:.5;cursor:default}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:var(--r-m);
    padding:36px 24px;text-align:center;color:var(--ink-3);font-size:14px}

  /* ---------- footer ---------- */
  .foot{position:relative;z-index:1;border-top:1px solid var(--line);padding:42px 26px 52px}
  .foot-in{max-width:1040px;margin:0 auto;display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .flogo{margin-bottom:7px}
  .flogo .wm{font-size:22px}
  .fname{font-size:12.5px;color:var(--ink-3);letter-spacing:.02em;margin-bottom:9px}
  .foot p{font-size:13px;color:var(--ink-3)}.foot p b{color:var(--ink-2);font-weight:600}
  .foot-links{margin-left:auto;display:flex;flex-wrap:wrap;gap:24px;font-size:13.5px;color:var(--ink-2)}
  .foot-links a{cursor:pointer;transition:.15s}.foot-links a:hover{color:#fff}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);opacity:0;
    background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(20px) saturate(180%);
    backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.16);
    color:#fff;padding:12px 21px;border-radius:12px;font-size:13.5px;
    transition:.24s cubic-bezier(.2,.8,.3,1);z-index:99;pointer-events:none;box-shadow:var(--sh-float)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 导航让位：先收紧，再换形态——不做横滑，看不见的标签等于不存在 */
  @media(max-width:1040px){
    .nav{gap:10px;padding:8px 8px 8px 16px}
    .tab{padding:8px 11px;font-size:13px}
  }
  /* 英文标签更长，880 就装不下；中文能撑到 780 */
  html[lang="en"] .nav{--nav-collapse:880px}
  @media(max-width:880px){
    html[lang="en"] .tabs{display:none}
    html[lang="en"] .navmenu-btn{display:inline-flex}
  }
  @media(max-width:780px){
    .tabs{display:none}
    .navmenu-btn{display:inline-flex}
    .nav .btn span{display:none}
    .nav .btn{padding:9px 12px}
  }
  @media(max-width:480px){
    .navmenu-btn span{display:none}
    .navmenu-btn{padding:9px 12px}
    .nav{padding:8px 12px;gap:8px}
  }

  /* ---- 手机端 ---- */
  @media(max-width:600px){
    /* hero 两个按钮并排放不下，改上下排布并撑满 */
    .hero-bar{display:flex;flex-direction:column;align-items:stretch;
      width:100%;max-width:340px;margin-left:auto;margin-right:auto;
      margin-top:32px;gap:8px}
    .hero-bar .btn{width:100%;justify-content:center}
    .btn-lg{padding:14px 20px;font-size:15px}

    .hero{padding:112px 18px 0}
    .hero h1{font-size:clamp(32px,8.6vw,44px);letter-spacing:-.03em}
    .hero-sub{margin-top:20px;font-size:14.5px;line-height:1.62}
    .wrap{padding:0 18px 60px}

    /* 触控区：语言切换和菜单按钮按 44px 可点标准放大 */
    .lang{padding:3px}
    .lang button{padding:9px 13px;font-size:12.5px;min-height:38px}
    .navmenu-btn{min-height:40px}
    .nav .btn{min-height:40px}
    .tr-btn{padding:6px 0;min-height:32px}

    /* 下拉面板在小屏改为贴合左右边距 */
    .navsheet{width:calc(100vw - 24px)}
    .navsheet .ns-item{padding:13px 14px;font-size:14.5px}

    .review{padding:15px 15px 16px}
    .rh{flex-wrap:wrap;row-gap:5px}
    .rdate{margin-left:0}

    /* 页脚链接一行排不下，换行并左对齐 */
    .foot-links{margin-left:0;gap:14px 18px;font-size:13px}
    .foot-in{gap:18px}
  }

  /* 极窄屏：iPhone SE 一档 */
  @media(max-width:380px){
    .hero h1{font-size:30px}
    .hero-stats{gap:0}
    .hs b{font-size:23px}
    .hs span{font-size:11.5px}
    .nav{padding:7px 10px;gap:6px}
    .lang button{padding:8px 10px;font-size:12px}
    .brand{font-size:16px}
  }

  /* ---- 平板 ---- */
  @media(min-width:601px) and (max-width:1024px){
    .hero{padding:126px 26px 0}
    .wrap{padding:0 26px 68px}
    /* 指针不精确时（触屏平板）同样放大点击区 */
  }
  @media(hover:none) and (pointer:coarse){
    .tab{min-height:40px;display:inline-flex;align-items:center}
    .lang button{min-height:36px}
    .tr-btn{min-height:32px}
  }

  @media(max-width:880px){
    .hero{padding:132px 20px 0}.hero-in{padding-bottom:56px}
    .hero-stats{grid-template-columns:repeat(2,1fr)}
    .hs{padding:20px 8px 0}
    .hs:nth-child(3)::before{display:none}
    .hs:nth-child(3),.hs:nth-child(4){border-top:1px solid var(--line)}
    .qc-p0{grid-template-columns:1fr}
    .jobs{grid-template-columns:1fr}.wrap{padding:0 20px 70px}
    .evd{display:block;overflow-x:auto}
    .aurora i{filter:blur(70px)}
  }
</style>


</head>
<body>

<div class="aurora"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<nav class="nav glass" id="tabbar">
  <div class="logo"><span class="wm">Eynap</span></div>
  <div class="tabs">
    <button class="tab active" data-p="overview"></button>
    <button class="tab" data-p="detail"></button>
    <button class="tab" data-p="install"></button>
    <button class="tab" data-p="quality"></button>
    <button class="tab" data-p="eval"></button>
    <button class="tab" data-p="versions"></button>
    <button class="tab" data-p="reviews"></button>
    <button class="tab" data-p="credits"></button>
  </div>
  <button class="navmenu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false">
    <svg><use href="#i-menu"/></svg><span id="menu-cur"></span>
  </button>
  <div class="lang" id="lang">
    <button data-lang="zh">中</button><button data-lang="en">EN</button>
  </div>
  <button class="btn btn-light" onclick="downloadZip()"><svg><use href="#i-dl"/></svg><span id="nav-dl"></span></button>
</nav>
<div class="navsheet glass" id="navsheet">
  <button class="ns-item" data-p="overview"></button>
  <button class="ns-item" data-p="detail"></button>
  <button class="ns-item" data-p="install"></button>
  <button class="ns-item" data-p="quality"></button>
  <button class="ns-item" data-p="eval"></button>
  <button class="ns-item" data-p="versions"></button>
  <button class="ns-item" data-p="reviews"></button>
  <button class="ns-item" data-p="credits"></button>
</div>

<div class="stage">
<div class="hero">
  <div class="hero-in">
    <h1><span id="hero-l1"></span><br><span class="l2" id="hero-l2"></span></h1>
    <p class="hero-sub" id="tagline"></p>
    <div class="hero-bar glass">
      <button class="btn btn-light btn-lg" onclick="downloadZip()"><svg><use href="#i-dl"/></svg><span id="hero-dl"></span></button>
      <button class="btn btn-line btn-lg" onclick="openInstall()"><span id="hero-ins"></span><svg><use href="#i-arrow-r"/></svg></button>
    </div>
    <div class="hero-stats">
      <div class="hs"><b id="hs-atoms">6</b><span id="st-atoms"></span></div>
      <div class="hs"><b id="hs-q"></b><span id="st-q"></span></div>
      <div class="hs"><b id="hs-dl"></b><span id="st-dl"></span></div>
      <div class="hs"><b id="hs-ver" class="mono"></b><span id="st-ver"></span></div>
    </div>
  </div>
</div>

<div class="wrap">
  <main class="main">
    <!-- 用它做什么 -->
    <section class="pane active" id="pane-overview">
      <div class="sect-h" id="h-what"></div>
      <div class="what" id="what"></div>
      <div class="sect-h" id="h-job"></div>
      <div class="jobs" id="jobs"></div>
      <div class="sect-h" id="h-before"></div>
      <div class="acc open"><div class="acc-head"><span id="h-pre"></span><span class="caret"><svg><use href="#i-chev"/></svg></span></div>
        <div class="acc-body"><ul id="list-pre"></ul></div></div>
      <div class="acc"><div class="acc-head"><span id="h-io"></span><span class="caret"><svg><use href="#i-chev"/></svg></span></div>
        <div class="acc-body"><ul id="list-io"></ul></div></div>
    </section>

    <!-- 6 个技能 -->
    <section class="pane" id="pane-detail">
      <div class="sect-h" id="h-flow"></div>
      <div class="flow" id="flow"></div>
      <p class="flow-note" id="flow-note"></p>
      <div class="sect-h" style="margin-top:34px" id="h-skills"></div>
      <div class="atomlist" id="atoms"></div>
    </section>

    <!-- 安装 -->
    <section class="pane" id="pane-install">

<script>
/* 评价与下载计数的后端地址。
   留空：使用同源的本地 server.mjs（开发用）
   填 Workers 地址：公网部署，例如 https://eynap-api.<你的账号>.workers.dev */
const API_BASE = 'https://eynap-api.chenjy4.workers.dev';
/* 下载走 GitHub Release：自带官方下载统计，零部署。
   评价服务另需 worker/（见 worker/README.md）。 */
const GH_REPO = 'AntaresYuan/eynap';
const GH_TAG  = 'v2.0.0';
const GH_ASSET= 'eynap-2.0.0.zip';
const RELEASE_URL = `https://github.com/${GH_REPO}/releases/download/${GH_TAG}/${GH_ASSET}`;
let S=null, myRate={feature:5,effect:5,stability:5};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stars=n=>'★'.repeat(Math.round(n))+'☆'.repeat(5-Math.round(n));

/* ---------- 语言 ----------
   优先级：用户手动选过 > 浏览器语言 > 默认中文。
   说明：纯前端拿不到 IP 归属地，navigator.language 由系统区域设置决定，
   在真实使用中与所在地高度相关，且不需要请求任何第三方定位服务。 */
let LANG='zh';
/* 中文区：这些地区默认进中文版 */
const ZH_REGIONS = ['CN','HK','MO','TW','SG'];

/* 同步判断：手动选过 > 浏览器语言。先用它立刻渲染，避免白屏等网络。 */
function detectLang(){
  const saved=localStorage.getItem('eynap-lang');
  if(saved==='zh'||saved==='en') return saved;
  const cached=sessionStorage.getItem('eynap-geo');
  if(cached) return ZH_REGIONS.includes(cached) ? 'zh' : 'en';
  const nav=(navigator.languages&&navigator.languages[0])||navigator.language||'';
  return /^zh\b/i.test(nav) ? 'zh' : 'en';
}

/* 异步按 IP 归属地校正。只在用户从未手动选过语言时生效。
   单一数据源会误判（同一网络下 Cloudflare 报 JP、ipapi 报 CN），所以并行取两家，
   任一判为中文区就按中文，宁可多显示中文也不让中文用户看到英文。 */
async function refineLangByGeo(){
  if(localStorage.getItem('eynap-lang')) return;   // 手动选择优先，不覆盖
  if(sessionStorage.getItem('eynap-geo')) return;  // 本次会话已测过
  const probes = [
    fetch('https://www.cloudflare.com/cdn-cgi/trace')
      .then(r=>r.text()).then(t=>(t.match(/loc=(\w+)/)||[])[1]),
    fetch('https://ipapi.co/country/')
      .then(r=>r.ok?r.text():Promise.reject()).then(t=>t.trim())
  ];
  let codes=[];
  try{
    codes = (await Promise.allSettled(probes))
      .filter(x=>x.status==='fulfilled' && x.value)
      .map(x=>String(x.value).toUpperCase());
  }catch(e){ return; }
  if(!codes.length) return;                        // 全失败就保持浏览器语言判断
  const want = codes.some(c=>ZH_REGIONS.includes(c)) ? 'zh' : 'en';
  sessionStorage.setItem('eynap-geo', codes[0]);
  if(want !== LANG){
    LANG = want;
    document.documentElement.lang = want==='zh' ? 'zh-CN' : 'en';
    $$('#lang button').forEach(b=>b.classList.toggle('on', b.dataset.lang===want));
    render();
  }
}
function T(){return I18N[LANG];}
const pick=(o,k)=>LANG==='en'&&o[k+'En']?o[k+'En']:o[k];
function setLang(l){
  LANG=l; localStorage.setItem('eynap-lang',l);
  document.documentElement.lang = l==='zh' ? 'zh-CN' : 'en';
  $$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));
  render();
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');
  clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2400);}

/* 头像配色：按名字取色，同一个名字永远同一个颜色。
   六组色相，都压在深色底上能看清的亮度区间。 */
const AV_PAIRS = [
  ['#4080FF','#1a5fd0'], ['#3fb6a8','#1c7f74'], ['#c07cf0','#7a3fb8'],
  ['#e8935c','#b85f28'], ['#5fa8e0','#2b6ea8'], ['#7bc96f','#3f8f38']
];
function avatarFor(name){
  const s = String(name || '?');
  let hash = 0;
  for(let i=0;i<s.length;i++) hash = (hash*31 + s.charCodeAt(i)) >>> 0;
  const [a,b] = AV_PAIRS[hash % AV_PAIRS.length];
  const ch = s.trim().charAt(0).toUpperCase() || '?';
  return { a, b, ch: esc(ch) };
}

/* 前端判断评价语种，与 worker 保持同一规则 */
/* 与 worker 的 guessLang 保持同一套规则。界面只有中英，
   但评价可能是任何语言，所以如实报语种而不是二选一。 */
function guessTextLang(text){
  const s=String(text||''), n=re=>(s.match(re)||[]).length;
  if(n(/[\u3040-\u309f\u30a0-\u30ff]/g)>0) return 'ja';   // 假名先于汉字
  if(n(/[\uac00-\ud7af\u1100-\u11ff]/g)>0) return 'ko';
  if(n(/[\u0400-\u04ff]/g)>0) return 'ru';
  if(n(/[\u0600-\u06ff\u0750-\u077f]/g)>0) return 'ar';
  if(n(/[\u0e00-\u0e7f]/g)>0) return 'th';
  const han=n(/[\u4e00-\u9fff\u3400-\u4dbf]/g), latin=n(/[A-Za-z]/g);
  if(han>0 && han*4>latin) return 'zh';
  if(latin>0) return /[àâäçéèêëîïôöùûüÿñãõáíóúýåæøßœ]/i.test(s) ? 'eur' : 'en';
  return 'und';
}

/* 该不该翻。und 判不出来，翻了也是碰运气 */
function needsTr(srcLang, uiLang){
  return !!srcLang && srcLang !== 'und' && srcLang !== uiLang;
}

/* 展开 / 收起译文。译文取回后存在 DOM 上，重复切换不再请求。 */
/* 外语评价默认显示译文，按钮用来切回原文。
   译文优先取列表接口带回的缓存，没有才请求翻译。 */
function toggleTranslation(btn){
  const card = btn.closest('.review');
  const p    = card.querySelector('.rtext');
  const t    = T();
  const tr   = card.dataset.tr;
  if(!tr) return;                       // 还没翻出来，按钮此时不可用

  const showingTr = p.classList.contains('translated');
  p.textContent = showingTr ? card.dataset.orig : tr;
  p.classList.toggle('translated', !showingTr);
  btn.textContent = showingTr ? t.trShow : t.trOrig;
}

/* 把当前界面语言下还没有译文的外语评价补翻出来。
   列表接口已带回缓存译文，所以这里通常一条都不需要请求。 */
async function autoTranslatePending(){
  if(!API_BASE) return;
  const cards = $$('.review[data-foreign="1"]').filter(c => !c.dataset.tr);
  if(!cards.length) return;

  const t = T();
  // 并发上限 3，避免一次打满
  const queue = cards.slice();
  const worker = async () => {
    while(queue.length){
      const card = queue.shift();
      const id   = Number(card.dataset.rid);
      const p    = card.querySelector('.rtext');
      const btn  = card.querySelector('.tr-btn');
      try{
        const r = await fetch(API_BASE+'/api/translate', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id, target: LANG })
        });
        if(!r.ok) throw new Error(String(r.status));
        const d = await r.json();
        if(!d.text) throw new Error('empty');
        // 后端判定原文已是目标语言时会原样返回，这种情况不标为译文
        if(d.same){
          card.removeAttribute('data-foreign');
          if(btn) btn.remove();
          continue;
        }
        card.dataset.tr = d.text;
        p.textContent = d.text;
        p.classList.add('translated');
        if(btn){ btn.textContent = t.trOrig; btn.onclick = ()=>toggleTranslation(btn); }
      }catch(e){
        // 翻译失败就保持原文，只把按钮收掉，不打扰阅读
        if(btn) btn.remove();
        card.removeAttribute('data-foreign');
      }
    }
  };
  await Promise.all([worker(), worker(), worker()]);
}

/* 从 GitHub Release 读真实下载量。失败就保持内联值，不显示假数字。 */
async function fetchDownloads(){
  try{
    const r = await fetch(`https://api.github.com/repos/${GH_REPO}/releases/latest`,
      {headers:{'Accept':'application/vnd.github+json'}});
    if(!r.ok) return;
    const j = await r.json();
    const total = (j.assets||[]).reduce((a,x)=>a+(x.download_count||0),0);
    S.downloads = total;
    const e = $('#hs-dl'); if(e) e.textContent = total;
  }catch(e){ /* 限流或离线时静默跳过 */ }
}

async function load(){
  if (API_BASE) {
    // 公网模式：页面是静态的，只有评价和下载数走远端
    S = JSON.parse(JSON.stringify(window.__STORE__));
    try {
      const live = await (await fetch(API_BASE + '/api/reviews')).json();
      S.reviews = live.reviews; S.downloads = live.downloads;
    } catch(e){ window.__OFFLINE__ = true; }
  } else {
    // 未配置远端：先试同源后端；拿不到就是静态托管，转为只读
    try {
      const r = await fetch('/api/store');
      if (!r.ok) throw new Error('no backend');
      S = await r.json();
    } catch(e) {
      S = JSON.parse(JSON.stringify(window.__STORE__));
      window.__READONLY__ = true;
    }
  }
  LANG=detectLang();
  $$('#lang button').forEach(b=>b.classList.toggle('on',b.dataset.lang===LANG));
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  render();
  if(window.__OFFLINE__) toast(T().offline);
  fetchDownloads();
  refineLangByGeo();
}

    ${q.groups.map(g=>`
      <div class="lvl lvl${g.level.slice(1)}">
        <div class="lvl-h"><span class="lvl-tag">${g.level}</span><b>${esc(pick(g,'levelLabel'))}</b><span class="ln">${esc(pick(g,'levelNote'))}</span></div>
        ${g.items.map(d=>{const ok=d.pass>=d.total;return `<div class="lvl-row"><div class="l">${esc(pick(d,'dim'))}</div>
          <div class="pass">${d.pass}/${d.total} <span class="${ok?'ok':'no'}">${ok?t.passWord:t.todo}</span></div></div>`;}).join('')}
      </div>`).join('')}
    <div class="note">${t.qcNote}</div>`;
}

function renderReviews(){
  const t=T(), rs=S.reviews, avg=reviewAvg();
  const stars3=k=>`<span class="mini-stars">${[1,2,3,4,5].map(i=>`<span class="${i<=myRate[k]?'on':''}" data-k="${k}" data-v="${i}">★</span>`).join('')}</span>`;
  const f=k=>(rs.reduce((a,r)=>a+r[k],0)/(rs.length||1)).toFixed(1);
  $('#pane-reviews').innerHTML=`
    <div class="rsummary">
      <div><div class="avg">${avg.toFixed(1)}</div><div class="stars">${stars(avg)}</div>
        <div class="rc">${rs.length} ${t.rvCount}</div></div>
      <div class="dims3">
        <div class="d3">${t.rvF}<b>${f('feature')}</b></div>
        <div class="d3">${t.rvE}<b>${f('effect')}</b></div>
        <div class="d3">${t.rvS}<b>${f('stability')}</b></div>
      </div>
    </div>
    <div class="rform">
      <input id="rv-author" class="rv-author" placeholder="${t.rvName}" maxlength="40">
      <textarea id="rv-text" placeholder="${t.rvText}"></textarea>
      <div class="row">
        <div class="rate-grp">${t.rvF} ${stars3('feature')}</div>
        <div class="rate-grp">${t.rvE} ${stars3('effect')}</div>
        <div class="rate-grp">${t.rvS} ${stars3('stability')}</div>
        <button class="send" id="rv-send">${t.rvSend}</button>
      </div>
    </div>
    <div class="rlist-h">${t.rvAll}</div>
    <div id="review-list">${rs.length?rs.map(r=>{
      // 只在评价语种与当前界面不同时才给翻译入口
      // 外语评价默认显示译文：有缓存直接用，没有则标记待翻译
      const foreign = r.id != null && API_BASE &&
                      needsTr(r.lang || guessTextLang(r.text), LANG);
      const cached  = LANG === 'zh' ? r.trans_zh : r.trans_en;
      const showTr  = foreign && !!cached;
      const pending = foreign && !cached;
      const av = avatarFor(r.author);
      return `
      <div class="review" data-rid="${r.id ?? ''}"
           ${foreign?`data-foreign="1"`:''}
           ${cached?`data-tr="${esc(cached)}"`:''}
           data-orig="${esc(r.text)}"><div class="rh">
        <div class="av" style="--av-a:${av.a};--av-b:${av.b}">${av.ch}</div>
        <span class="ra">${esc(r.author)}</span>${r.owner?`<span class="owner-tag">${t.ownerTag}</span>`:''}
        <span class="rstars">${stars((r.feature+r.effect+r.stability)/3)}</span>
        <span class="rdate">${r.date}</span></div>
        <p class="rtext${showTr?' translated':''}" data-note="${t.trNote}">${esc(showTr ? cached : r.text)}</p>
        ${foreign?`<button class="tr-btn" data-rid="${r.id}">${
          pending ? t.trLoading : t.trOrig
        }</button>`:''}
      </div>`;}).join('')
      :`<div class="empty">${t.rvEmpty}</div>`}</div>`;
  ['feature','effect','stability'].forEach(k=>{
    $$(`[data-k="${k}"]`).forEach(s=>s.onclick=()=>{myRate[k]=+s.dataset.v;
      $$(`[data-k="${k}"]`).forEach(x=>x.classList.toggle('on',+x.dataset.v<=myRate[k]));});
  });
  $$('.tr-btn').forEach(b=>{
    b.onclick = ()=>toggleTranslation(b);
    // 还没译文时按钮不可点，等补翻完成后再启用
    if(!b.closest('.review').dataset.tr) b.disabled = true;
  });
  autoTranslatePending();
  if(window.__READONLY__ && !API_BASE){
    const b=$('#rv-send');
    b.textContent = t.rvGithub;
    b.onclick = ()=>window.open(`https://github.com/${GH_REPO}/issues/new/choose`,'_blank','noopener');
    const box=$('#rv-text');
    if(box) box.placeholder = t.rvPlaceholderRO;
  } else {
    $('#rv-send').onclick=submitReview;
  }
}

async function submitReview(){
  const t=T(), body=$('#rv-text').value.trim();
  if(!body){toast(t.toastNeedText);return;}
  if(window.__READONLY__ && !API_BASE){toast(t.toastReadonly);return;}
  if(window.__OFFLINE__){toast(t.toastOffRv);return;}
  const who=$('#rv-author').value.trim();
  try{
    const r=await fetch(API_BASE+'/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({author:who,text:body,version:S.plugin.latestVersion,
        feature:myRate.feature,effect:myRate.effect,stability:myRate.stability})});
    if(!r.ok){
      const e=await r.json().catch(()=>({}));
      toast(r.status===429?t.toastRate:(r.status===409?t.toastDup:t.toastFail));return;}
    const d=await r.json();
    S.reviews=d.reviews; if(d.downloads!=null) S.downloads=d.downloads;
    renderReviews(); toast(t.toastSaved);
  }catch(e){toast(t.toastFail);}
}

/* 菜单按钮显示当前分区名，收起时用户也知道自己在哪 */
function syncNavMenu(){
  const on=$('.tab.active'); if(!on) return;
  const p=on.dataset.p, label=on.textContent;
  const cur=$('#menu-cur'); if(cur) cur.textContent=label;
  $$('.ns-item').forEach(b=>b.classList.toggle('on', b.dataset.p===p));
}
function closeNavSheet(){
  $('#navsheet')?.classList.remove('open');
  $('#menuBtn')?.setAttribute('aria-expanded','false');
}
function go(p){
  $$('.tab').forEach(x=>x.classList.toggle('active',x.dataset.p===p));
  syncNavMenu(); closeNavSheet();
  $$('.pane').forEach(x=>x.classList.remove('active'));
  $('#pane-'+p).classList.add('active');
  scrollTo({top:$('.wrap').getBoundingClientRect().top+scrollY-92,behavior:'smooth'});
}
$$('.tab').forEach(t=>t.onclick=()=>go(t.dataset.p));
$$('.ns-item').forEach(t=>t.onclick=()=>go(t.dataset.p));
function placeNavSheet(){
  const b=$('#menuBtn'), s=$('#navsheet');
  if(!b||!s) return;
  const r=b.getBoundingClientRect();
  s.style.setProperty('--ns-top', (r.bottom + 8) + 'px');
  // 宽度由 CSS 决定（手机端会变宽），这里读实际值，不要写死
  const prev = s.style.visibility;
  s.style.visibility='hidden'; s.style.display='block';
  const w = s.getBoundingClientRect().width;
  s.style.display=''; s.style.visibility=prev;
  // 与按钮左缘对齐；贴近右边界时回收，保证两侧都留边距
  const left = Math.min(r.left, innerWidth - w - 12);
  s.style.setProperty('--ns-left', Math.max(12, left) + 'px');
}
$('#menuBtn').onclick=e=>{
  e.stopPropagation();
  const s=$('#navsheet'), open=!s.classList.contains('open');
  if(open) placeNavSheet();
  s.classList.toggle('open', open);
  $('#menuBtn').setAttribute('aria-expanded', String(open));
};
document.addEventListener('click', e=>{
  if(!e.target.closest('#navsheet') && !e.target.closest('#menuBtn')) closeNavSheet();
});
addEventListener('keydown', e=>{ if(e.key==='Escape') closeNavSheet(); });
$$('[data-jump]').forEach(a=>a.onclick=()=>go(a.dataset.jump));
$$('#lang button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
document.addEventListener('click',e=>{
  const head=e.target.closest('.acc-head');
  if(head) head.parentElement.classList.toggle('open');
});
function openInstall(){go('install');}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast(T().toastCopied+t.slice(0,40))).catch(()=>{});}
function downloadZip(){
  // 统一走 Release 直链：GitHub 侧自动计数
  if(window.__READONLY__ || API_BASE){
    window.location.href = RELEASE_URL;
    toast(T().toastDl);
    // 计数有缓存延迟，几秒后回读一次
    setTimeout(fetchDownloads, 4000);
    return;
  }
  if(!API_BASE && window.__OFFLINE__){toast(T().toastOffDl);return;}
  window.location.href='/api/download';
  setTimeout(()=>{toast(T().toastDl);fetch('/api/store').then(r=>r.json()).then(s=>{
    S=s;const e=$('#hs-dl'); if(e) e.textContent=s.downloads;});},600);}
addEventListener('resize', ()=>{clearTimeout(window.__rz);
  window.__rz=setTimeout(closeNavSheet,150);});
addEventListener('scroll', closeNavSheet, {passive:true});
load();
</script>
